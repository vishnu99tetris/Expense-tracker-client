name: Deploy Frontend

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: expense-tracker-client
  ECR_REGISTRY: 011356579990.dkr.ecr.ap-south-1.amazonaws.com
  ECS_CLUSTER: default
  ECS_SERVICE: expense-tracker-frontend

  EXECUTION_ROLE_ARN: arn:aws:iam::011356579990:role/service-role/ecsTaskExecutionRole
  INFRASTRUCTURE_ROLE_ARN: arn:aws:iam::011356579990:role/service-role/ecsInfrastructureRoleForExpressServices

  NEXT_PUBLIC_API_URL: https://15-206-140-203.sslip.io

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::011356579990:role/GitHubActionsExpenseTrackerFrontendRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build             --build-arg NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL}"             -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"             .

          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Deploy to ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          execution-role-arn: ${{ env.EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ env.INFRASTRUCTURE_ROLE_ARN }}
          container-port: "3000"
          health-check-path: "/"
          cpu: "1024"
          memory: "2048"
          min-task-count: "1"
          max-task-count: "2"
          auto-scaling-metric: "AVERAGE_CPU"
          auto-scaling-target-value: "60"
